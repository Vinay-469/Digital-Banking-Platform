<div class="login-page">
  <div class="video-bg-wrapper">
    <video autoplay muted loop class="bg-video">
      <source src="/assets/5bdb6c0ffa8ac8b5b122c9831bd35b0f (1).mp4" type="video/mp4">
    </video>
  </div>
  <div class="overlay">
    <div class="login-form">
      <img src="/assets/logo2.png" alt="logo" style="width: 40%;margin-left: 30%;">
      <h4 class="text-center">Login</h4>
      <form>
        <div class=" pt-3 text-center">
          <div class=" d-flex flex-column">
            <mat-form-field appearance="outline" class="small-field">
              <mat-label>Enter Username</mat-label>
              <input matInput name="username" class="text-center" [(ngModel)]="username">
            </mat-form-field>
          </div>
          <div class="d-flex flex-column py-3">
            <mat-form-field appearance="outline" class="small-field">
              <mat-label class="text-center">Enter Password</mat-label>
              <input matInput name="password" class="text-center scheme" [(ngModel)]="password"
                [type]="hide() ? 'password' : 'text'">
            </mat-form-field>
          </div>
          <small>
            <a routerLink="/reset" class="text-primary">Forgot password</a>
          </small>
          <button type="submit" class="btn btn-primary w-100 mt-1" (click)="Submit()">
            Submit
          </button>
          <p class="mt-2">
            Apply for a
            <a routerLink="/register" class="text-primary">
              new bank account
            </a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
