<div class="container pt-9 w-75 vh-95">
    <div class="card shadow p-4 col-md-5 mx-auto">
        <h4 class="text-center mb-4">
            Create New Password
        </h4>
        <form [formGroup]="resetForm" (ngSubmit)="resetPassword()">
            <div class="mb-3">
                <label class="form-label">
                    Enter new password
                </label>
                <input type="password" class="form-control" formControlName="password">
                <small class="text-danger"
                    *ngIf="resetForm.get('password')?.touched && resetForm.get('password')?.invalid">
                    Enter valid password
                </small>
            </div>
            <div class="mb-3">
                <label class="form-label">
                    Confirm password
                </label>
                <input type="password" class="form-control" formControlName="confirmPassword">
                <small class="text-danger" *ngIf="resetForm.get('confirmPassword')?.touched && resetForm.get('confirmPassword')?.invalid ">
                    Enter valid password
                </small>
                <small class="text-danger" *ngIf="resetForm.get('password')?.value !== resetForm.get('confirmPassword')?.value && resetForm.get('confirmPassword')?.touched">
                    password does not match
                </small>
            </div>
            <button type="submit" class="btn btn-success w-100" [disabled]="resetForm.invalid">
                Reset
            </button>
        </form>
    </div>
</div>
