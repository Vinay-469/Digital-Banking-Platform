<div class="vh-95 pt-6 ms-7">
    <div class="center w-50 p-4 shadow">
        <h4 class="p-2 mb-4 bg-bank rounded text-white">KYC Documents</h4>
        <div class="pb-3">
            <h5>Name: {{user?.fullName}}</h5>
            <h6>Email: {{user?.email}}</h6>
            <h6>Contact: {{user?.phone}}</h6><hr>
        </div>
        <div class="d-flex justify-content-between mb-3">
            <span>Profile Image</span>
            <div>
                <button class="btn btn-sm btn-info me-2" (click)="viewDocument('Profile')"><i class="bi bi-eye"></i>
                    View</button>
                <button class="btn btn-sm btn-success" (click)="downloadDocument('Profile')"><i
                        class="bi bi-download"></i> Download</button>
            </div>
        </div>

        <div class="d-flex justify-content-between mb-3">
            <span>Aadhaar - {{this.user?.kyc?.adhaarNumber}}</span>
            <div>
                <button class="btn btn-sm btn-info me-2" (click)="viewDocument('Adhaar')"><i class="bi bi-eye"></i>
                    View</button>
                <button class="btn btn-sm btn-success" (click)="downloadDocument('Adhaar')"><i
                        class="bi bi-download"></i> Download</button>
            </div>
        </div>

        <div class="d-flex justify-content-between">
            <span>PAN - {{this.user?.kyc?.panNumber}}</span>
            <div>
                <button class="btn btn-sm btn-info me-2" (click)="viewDocument('Pan')"><i class="bi bi-eye"></i>
                    View</button>
                <button class="btn btn-sm btn-success" (click)="downloadDocument('Pan')"><i class="bi bi-download"></i>
                    Download</button>
            </div>
        </div>
    </div>
</div>
